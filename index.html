<style>
@font-face { font-family: 'Baloo 2'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url(assets/fonts/Baloo2-latin-ext.woff2) format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'Baloo 2'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url(assets/fonts/Baloo2-latin.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212; }
body { margin: 0; background: #f8f3e6; }
[hidden] { display: none !important; }
</style>
<style>
/* A picture-book road trip through Sweden: the whole screen is the scene, controls are chunky toys,
   and nothing needs reading. Single deliberate look, shared letter colours with Lilla Piano. */
:root {
  --navy: #12306b; --sun: #f6c21c; --coral: #f4614d; --teal: #22b3a6; --pink: #f2577d;
  --gas: #2fb36a; --gas-dark: #1c7f49; --paper: #fffaf0; --sky: #8fd6f5;
  --display: 'Baloo 2', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif;
  --gap: max(16px, env(safe-area-inset-left, 0px));
  --gap-r: max(16px, env(safe-area-inset-right, 0px));
}
html, body { height: 100%; background: var(--sky); overflow: hidden; color: var(--navy); }
#app { position: fixed; inset: 0; overflow: hidden; font-family: var(--display); font-weight: 800;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer;
  touch-action: none; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 4px solid var(--navy); outline-offset: 3px; }
svg { display: block; }

/* toy buttons */
.toy { display: grid; place-items: center; border-radius: 999px; background: var(--paper);
  box-shadow: 0 .42rem 0 rgba(18,48,107,.28); transition: transform .08s; }
.toy:active { transform: translateY(.3rem); box-shadow: 0 .12rem 0 rgba(18,48,107,.28); }
.small { flex: none; width: clamp(46px, 11vmin, 62px); height: clamp(46px, 11vmin, 62px); }
#spare { width: clamp(24px, 6vmin, 32px); height: clamp(24px, 6vmin, 32px); flex: none; }
.small svg { width: 58%; height: 58%; }

/* HUD */
#hud { position: absolute; left: var(--gap); right: var(--gap-r); top: max(12px, env(safe-area-inset-top, 0px));
  display: flex; align-items: center; gap: clamp(8px, 2vw, 18px); pointer-events: none; }
#hud > * { pointer-events: auto; }
#fuel { display: flex; align-items: center; gap: 8px; background: var(--paper); border-radius: 999px;
  padding: 5px 14px 5px 8px; box-shadow: 0 .3rem 0 rgba(18,48,107,.22); }
#fuel svg { width: clamp(32px, 8vmin, 44px); height: clamp(32px, 8vmin, 44px); }
#fuelBar { width: clamp(64px, 22vw, 230px); height: clamp(18px, 4.6vmin, 26px); border-radius: 99px;
  background: #e7dfcc; overflow: hidden; }
#fuelFill { height: 100%; width: 100%; border-radius: 99px; background: var(--gas); transition: background .3s; }
#fuel.low { animation: wiggle .55s infinite; }
#fuel.low #fuelFill { background: var(--coral); }
#winterTitle { font-size: clamp(22px, 7vmin, 38px); font-weight: 800; text-align: center; }
#winterPick { flex-wrap: wrap; justify-content: center; gap: clamp(4px, 1.5vmin, 12px); }
#winter .card { width: min(94vw, 640px); max-width: none; }
.snowPick { position: relative; flex: 0 0 auto; width: clamp(84px, 21vmin, 112px); height: clamp(84px, 21vmin, 112px); padding: 0; border: 4px solid transparent; border-radius: 20px; background: #dff1fb; cursor: pointer; }
.snowPick.sel { border-color: var(--sun); }
.snowPick canvas { display: block; width: 100%; height: 100%; }
.snowPick .tag { position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; padding: 0 .4em; border-radius: 99px; background: var(--navy); color: #fff; font-size: 14px; font-weight: 800; }
.snowPick .tag svg { width: 14px; height: 14px; }
#bonus { pointer-events: none; }
#bonus > * { pointer-events: auto; }
#bonusBack { position: absolute; left: var(--gap); top: max(12px, env(safe-area-inset-top, 0px)); }
#bonusSkip { position: absolute; right: var(--gap-r); top: max(12px, env(safe-area-inset-top, 0px)); }
#bonusTitle { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); pointer-events: none; padding: .1em .9em; border-radius: 24px; background: var(--paper); text-align: center; white-space: nowrap; box-shadow: 0 .3rem 0 rgba(18,48,107,.22); }
#bonusTitle b { display: block; font-size: clamp(22px, 7vmin, 38px); line-height: 1.1; } #bonusTitle span { font-size: clamp(14px, 4vmin, 22px); }
#bonusStart { position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); margin-left: calc(clamp(84px, 24vmin, 124px) / -2); width: clamp(84px, 24vmin, 124px); height: clamp(84px, 24vmin, 124px); }
#bonusDots { position: absolute; top: max(16px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; pointer-events: none; }
#bonusDots i { width: 22px; height: 22px; background: rgba(255,250,240,.8); clip-path: polygon(50% 0, 63% 34%, 100% 36%, 71% 58%, 81% 95%, 50% 75%, 19% 95%, 29% 58%, 0 36%, 37% 34%); } #bonusDots i.on { background: var(--sun); } #bonusDots i.now { background: var(--coral); }
#bonusGo { position: absolute; right: var(--gap-r); bottom: max(16px, env(safe-area-inset-bottom, 0px)); width: clamp(76px, 22vmin, 112px); height: clamp(76px, 22vmin, 112px); animation: nudge 1.1s infinite; }
#bonusPrize { position: static; width: clamp(64px, 20vmin, 104px); height: clamp(64px, 20vmin, 104px); }
#bonusGold { width: clamp(52px, 16vmin, 86px); height: clamp(52px, 16vmin, 86px); }
#bonusCard { position: absolute; bottom: max(14px, env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); padding-block: 8px; white-space: nowrap; }
#bonusCard .row:first-child:has(> [hidden]:only-child) { display: none; }
.toy.bonusGo { width: clamp(64px, 18vmin, 88px); height: clamp(64px, 18vmin, 88px); background: #fff3c4; border: 5px solid var(--sun); animation: nudge 1.1s infinite; }
.toy.bonusGo svg { width: 76%; height: 76%; }
.bonusStop { background: radial-gradient(circle at 50% 42%, #fff3c4, #ffd65c) !important; box-shadow: 0 0 0 4px var(--sun), 0 .3rem 0 rgba(18,48,107,.24); }
.bonusStop.fresh { animation: nudge 1.1s infinite; }
.bonusStar { position: absolute; right: 2%; bottom: 0; width: 34%; }
.bonusStar svg { display: block; width: 100%; height: auto; }
#fuel, #coins { position: relative; }
#fuel.hit, #coins.hit { animation: wiggle .3s 2; }
#fuel.hit #fuelFill { background: var(--coral); }
.loss { position: absolute; left: 50%; top: 100%; padding: .02em .5em; border-radius: 99px; background: var(--coral); color: #fff;
  font-weight: 800; white-space: nowrap; pointer-events: none; opacity: 0; }
.loss.hit { animation: lossPop 1.6s ease-out both; }
@keyframes lossPop { 0% { opacity: 0; transform: translate(-50%, -40%) scale(.5) } 14% { opacity: 1; transform: translate(-50%, 16%) scale(1.3) }
  72% { opacity: 1; transform: translate(-50%, 24%) scale(1) } 100% { opacity: 0; transform: translate(-50%, 60%) scale(.9) } }
@keyframes wiggle { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-2.4deg) scale(1.04) } 75% { transform: rotate(2.4deg) scale(1.04) } }
#trip { flex: 1; min-width: 30px; margin-inline: 8px; height: 12px; border-radius: 9px; background: rgba(255,250,240,.75); position: relative; }
#tripDot { position: absolute; top: 50%; left: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px;
  background-size: contain; background-repeat: no-repeat; background-position: center; }
#tripEnd { position: absolute; right: -6px; top: -7px; width: 26px; height: 26px; }
#coins { display: flex; align-items: center; gap: 6px; background: var(--paper); border-radius: 999px;
  padding: 2px 16px 2px 6px; box-shadow: 0 .3rem 0 rgba(18,48,107,.22);
  font-size: clamp(24px, 6vmin, 34px); line-height: 1.3; font-variant-numeric: tabular-nums; }
#coins svg { width: clamp(30px, 7.6vmin, 42px); height: clamp(30px, 7.6vmin, 42px); }
#coins.bump { animation: bump .18s; }
@keyframes bump { 50% { transform: scale(1.16) } }

@media (max-width: 520px) { #trip, #fullH { display: none } #hud { justify-content: space-between } }

/* pedals */
#gas { position: absolute; right: var(--gap-r); bottom: max(18px, calc(env(safe-area-inset-bottom, 0px) + 10px));
  width: clamp(124px, 34vmin, 230px); height: clamp(124px, 34vmin, 230px); border-radius: 30%;
  background: var(--gas); box-shadow: 0 .8rem 0 var(--gas-dark), 0 1.1rem 1.4rem rgba(0,0,0,.2);
  display: grid; place-items: center; transition: transform .07s, box-shadow .07s; }
#gas svg { width: 66%; height: 66%; }
#gas.down { transform: translateY(.55rem) scale(.97); box-shadow: 0 .25rem 0 var(--gas-dark); }
#gas.nudge { animation: nudge 1s infinite; }
#gas.ease { --gas: #f08a2c; --gas-dark: #c96a14; animation: nudge .4s infinite; }
@keyframes nudge { 50% { transform: scale(1.07) } }

#act { position: absolute; left: var(--gap); bottom: max(18px, calc(env(safe-area-inset-bottom, 0px) + 10px));
  width: clamp(96px, 26vmin, 170px); height: clamp(96px, 26vmin, 170px); border-radius: 50%; background: #1d9bf0;
  box-shadow: 0 .7rem 0 #1270b5, 0 1rem 1.2rem rgba(0,0,0,.18); display: grid; place-items: center; transition: transform .07s, box-shadow .07s; }
#act svg { width: 66%; height: 66%; pointer-events: none; }
#act:active { transform: translateY(.45rem); box-shadow: 0 .2rem 0 #1270b5; }
#act.horn { background: var(--sun); box-shadow: 0 .7rem 0 #c79a0c, 0 1rem 1.2rem rgba(0,0,0,.18); }
#act.call { animation: nudge .6s infinite; }

.fork { --fs: clamp(104px, 27vmin, 172px); position: absolute; left: var(--fork-x, 47%); width: var(--fs); height: var(--fs);
  margin-left: calc(var(--fs) / -2); border-radius: 50%; background: var(--paper);
  border: clamp(6px, 1.4vmin, 10px) solid var(--sun); display: grid; place-items: center; position: absolute;
  box-shadow: 0 .6rem 0 rgba(18,48,107,.28); animation: pop .28s cubic-bezier(.3,1.6,.6,1) both; }
.fork svg { width: 86%; height: 86%; }
#up { top: 13%; } #down { bottom: 7%; }
.fork.want { border-color: var(--coral); animation: pop .28s cubic-bezier(.3,1.6,.6,1) both, nudge .8s .3s infinite; }
.fork.tri { --fs: clamp(82px, 22vmin, 136px); }
#up.tri { top: calc(50% - var(--fs) * 1.6); } #mid { top: calc(50% - var(--fs) * .5); } #down.tri { bottom: calc(50% - var(--fs) * 1.6); }
@keyframes pop { from { transform: scale(.3); opacity: 0 } }
@media (max-aspect-ratio: 1/1) { #up { top: 24% } #down { bottom: 30% } }

/* screens */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: clamp(8px, 3vmin, 22px); padding-block: 14px; padding-left: var(--gap); padding-right: var(--gap-r); text-align: center; }
.dim { background: rgba(18,48,107,.34); }
#logo { display: flex; align-items: center; justify-content: center; gap: .14em; white-space: pre; font-size: clamp(52px, 17vmin, 124px); line-height: .9; letter-spacing: -.01em;
  text-shadow: 0 .05em 0 var(--paper), .03em 0 0 var(--paper), -.03em 0 0 var(--paper), 0 -.03em 0 var(--paper); }
#logo img { height: 1.24em; width: auto; margin-right: .06em; }
#title { justify-content: flex-start; padding-top: clamp(14px, 6vh, 64px); }
.play { width: clamp(104px, 28vmin, 170px); height: clamp(104px, 28vmin, 170px); background: var(--coral); }
.play svg { width: 54%; height: 54%; margin-left: 7%; }
#titlePlay { animation: nudge 1.3s infinite; }

.corner { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); left: var(--gap); right: var(--gap-r); display: flex; justify-content: space-between; pointer-events: none; }
.corner > * { pointer-events: auto; }
#hello { position: absolute; left: var(--gap); top: var(--hello-y, 30%); transform: translateY(-100%); max-width: 44vw; padding: .1em .7em; border-radius: 26px 26px 26px 6px;
  background: var(--paper); font-size: clamp(20px, 6vmin, 38px); line-height: 1.3; overflow-wrap: anywhere; box-shadow: 0 .3rem 0 rgba(18,48,107,.22); animation: pop .4s cubic-bezier(.3,1.6,.6,1) both; }
#whoForm { font-size: clamp(22px, 6vmin, 34px); }
#whoMoose { width: clamp(70px, 20vmin, 120px); height: auto; }
#whoName { font: inherit; color: inherit; text-align: center; width: min(70vw, 9em); padding: .1em .4em; border: 4px solid var(--sun); border-radius: 20px; background: #fff;
  outline: 0; touch-action: auto; user-select: text; -webkit-user-select: text; }
#map { background: linear-gradient(#8fd6f5, #d9f4e6 62%, #8ccf7b); justify-content: center; }
#mapTop { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); left: var(--gap); right: var(--gap-r);
  display: flex; align-items: center; justify-content: space-between; }
#map { padding-top: calc(max(12px, env(safe-area-inset-top, 0px)) + clamp(52px, 13vmin, 74px)); padding-bottom: 8px; }
#mapBody { flex: 1; min-height: 0; width: 100%; display: flex; gap: clamp(6px, 2vmin, 18px); }
#sweden { flex: none; height: 100%; aspect-ratio: 268 / 590; max-width: 42%; }
#sweden svg { display: block; width: 100%; height: 100%; }
#mapMoose { transition: transform 1.4s cubic-bezier(.4, 0, .3, 1); }
#stops { flex: 1; min-width: 0; overflow-y: auto; touch-action: pan-y; display: grid; align-content: start; justify-items: center;
  grid-template-columns: repeat(auto-fill, minmax(calc(var(--s) + 16px), 1fr)); gap: 6px 2px; padding: 4px 2px 14px; --s: clamp(62px, 18vmin, 104px); }
.stop, .spot { touch-action: pan-y; }
.spot { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.placeName { font-size: clamp(11px, 3.1vmin, 16px); line-height: 1.1; color: var(--navy); white-space: nowrap; }
#place { position: absolute; left: 0; top: calc(100% + 8px); padding: .05em .7em; border-radius: 12px; background: #1668b5; color: #fff; border: 2px solid #fff;
  font-size: clamp(17px, 4.6vmin, 28px); line-height: 1.3; white-space: nowrap; transform-origin: 0 0; pointer-events: none; box-shadow: 0 .2rem 0 rgba(18,48,107,.3); }
#place.intro { animation: placeIn 3s both; }
@keyframes placeIn { 0% { transform: scale(.4); opacity: 0 } 8%, 70% { transform: scale(1.7); opacity: 1 } 100% { transform: scale(1) } }
.stop { overflow: hidden; width: var(--s); height: var(--s); max-width: 100%; border-radius: 50%; position: relative;
  border: clamp(4px, 1vmin, 7px) solid var(--paper); box-shadow: 0 .4rem 0 rgba(18,48,107,.26); color: #fff;
  font-size: calc(var(--s) * .26); line-height: 1; display: grid; place-items: start center; text-shadow: 0 .06em 0 rgba(18,48,107,.6); }
.stop canvas { width: 100%; height: 100%; }
.stop .num { position: relative; margin-top: 3%; padding: 0 .36em; border-radius: 99px; background: var(--navy); text-shadow: none; }
.stop[disabled] { filter: grayscale(.75) brightness(.92); cursor: default; }
.stop .stars { position: absolute; left: 0; right: 0; bottom: -2%; display: flex; justify-content: center; gap: 1px; }
.stop .stars svg { width: 26%; height: auto; }
.stop.here { animation: nudge 1.1s infinite; }
#shopBtn { display: flex; align-items: center; gap: .4em; margin-top: clamp(4px, 1.5vmin, 12px); padding: .25em .9em .25em .5em;
  border-radius: 999px; background: var(--coral); box-shadow: 0 .4rem 0 #b83f2f; }
#shopBtn svg { width: clamp(34px, 9.500vmin, 54px); height: clamp(34px, 9.500vmin, 54px); }
@media (max-width: 520px) { #shopBtn { padding: .2em .5em; } #shopBtn svg:last-child { display: none; } #coinsMap { padding-right: 10px !important; font-size: 22px !important; } }
#champCups { display: flex; gap: 2px; font-size: clamp(22px, 6vmin, 32px); color: var(--navy); align-items: center; }
#champCups svg { width: 1.3em; height: 1.3em; }

/* market stall: awning on top, the car on show, wares on the counter */
#shop { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); grid-template-rows: auto minmax(0, 1fr); gap: 0 12px;
  padding-block: 0 10px; text-align: left; justify-content: stretch; align-items: stretch;
  background: linear-gradient(#fdeecb, #f7dca4); }
#awning { grid-column: 1 / -1; margin-left: calc(var(--gap) * -1); margin-right: calc(var(--gap-r) * -1);
  height: clamp(66px, 15vmin, 92px); padding: 0 var(--gap-r) 0 var(--gap); display: flex; align-items: center; justify-content: space-between;
  background: repeating-linear-gradient(90deg, #e8483f 0 56px, #fffaf0 56px 112px); box-shadow: 0 .3rem 0 rgba(18,48,107,.16); }
#shop.cold { background: linear-gradient(#bfe3f7, #eef8fc); }
#shop.cold #awning { background: repeating-linear-gradient(90deg, #1d6fb8 0 56px, #fffaf0 56px 112px); }
#seasonName { padding: 0 .8em; border-radius: 99px; background: var(--paper); font-size: clamp(20px, 5.5vmin, 30px); font-weight: 800; box-shadow: 0 .3rem 0 rgba(18,48,107,.22); }
#seasons { display: none; }
#shop.picking #stage, #shop.picking #counter { display: none; }
#shop.picking #seasons { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: clamp(10px, 4vmin, 32px); min-height: 0; }
.seasonBtn { flex: 0 1 44%; max-width: 380px; min-height: 0; max-height: 100%; display: flex; flex-direction: column; align-items: center; padding: 6px; border: 0; border-radius: 28px; color: var(--navy); font: inherit; font-size: clamp(22px, 7vmin, 36px); font-weight: 800; cursor: pointer; box-shadow: 0 .4rem 0 rgba(18,48,107,.24); }
#pickSommar { background: #d9f3c9; } #pickVinter { background: #cfe9f8; }
.seasonBtn canvas { position: static; width: 100%; height: auto; max-height: 56vh; object-fit: contain; }
@media (max-aspect-ratio: 1/1) { #shop.picking #seasons { flex-direction: column; } .seasonBtn { flex: 0 1 46%; width: min(80vw, 340px); } }
#wallet { display: flex; align-items: center; gap: 6px; background: var(--paper); border-radius: 99px; padding: 2px 16px 2px 6px;
  font-size: clamp(24px, 6vmin, 34px); line-height: 1.3; font-variant-numeric: tabular-nums; box-shadow: 0 .3rem 0 rgba(18,48,107,.22); }
#wallet svg { width: clamp(30px, 7.6vmin, 42px); height: clamp(30px, 7.6vmin, 42px); }
#wallet.broke { animation: wiggle .3s 2; }
#stage { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; }
#shopCar { position: relative; inset: auto; flex: 1; min-height: 0; width: 100%; height: auto; }
#buy { min-height: clamp(62px, 15vmin, 88px); flex: none; display: grid; place-items: center; }
#buyBtn { display: flex; align-items: center; gap: 8px; padding: .1em .8em .1em .45em; border-radius: 999px; background: var(--gas); color: #fff;
  font-size: clamp(30px, 8vmin, 46px); line-height: 1.3; box-shadow: 0 .4rem 0 var(--gas-dark); font-variant-numeric: tabular-nums;
  animation: pop .22s cubic-bezier(.3,1.6,.6,1) both, nudge 1.1s .3s infinite; }
#buyBtn svg { width: 1.2em; height: 1.2em; }
#buyBtn.poor { background: #b9b2a2; box-shadow: 0 .4rem 0 #8e8878; animation: pop .22s both; }
#counter { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding-top: 10px; }
#tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; flex: none; }
.tab { height: clamp(52px, 13vmin, 76px); border-radius: 20px; background: var(--paper); display: grid; place-items: center;
  box-shadow: 0 .25rem 0 rgba(18,48,107,.2); }
.tab svg { width: clamp(30px, 8vmin, 50px); height: clamp(30px, 8vmin, 50px); }
.tab.on { background: var(--navy); box-shadow: 0 .25rem 0 #0a1c44; }
#wares { flex: 1; min-height: 0; overflow-y: auto; touch-action: pan-y; display: grid; align-content: start;
  grid-template-columns: repeat(auto-fill, minmax(clamp(82px, 21vmin, 124px), 1fr)); grid-auto-rows: clamp(88px, 22vmin, 130px); gap: 10px; padding: 3px 3px 12px; }
.ware { position: relative; border-radius: 22px; background: var(--paper); box-shadow: 0 .3rem 0 rgba(18,48,107,.2);
  border: 4px solid transparent; display: grid; place-items: center; touch-action: pan-y; overflow: hidden; }
.ware canvas { position: static; width: 78%; height: 78%; object-fit: contain; }
.ware.sel { border-color: var(--sun); }
.ware.worn { border-color: var(--gas); }
.ware .tag { position: absolute; left: 0; right: 0; bottom: 3px; display: flex; justify-content: center; align-items: center; gap: 2px;
  font-size: clamp(14px, 3.4vmin, 19px); line-height: 1.2; font-variant-numeric: tabular-nums; }
.ware .tag svg { width: 1.05em; height: 1.05em; }
.ware.priced canvas { transform: translateY(-9%); }
.ware .pips { position: absolute; top: 6px; left: 0; right: 0; display: flex; justify-content: center; gap: 4px; }
.ware .pips i { width: 10px; height: 10px; border-radius: 50%; background: #e7dfcc; }
.ware .pips i.on { background: var(--gas); }
.ware .tick { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; }
@media (max-aspect-ratio: 1/1) { #shop { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 2fr) minmax(0, 3fr); } }

.card { background: var(--paper); border-radius: 36px; padding: clamp(10px, 3vmin, 24px) clamp(18px, 6vmin, 44px);
  display: flex; flex-direction: column; align-items: center; gap: clamp(4px, 2vmin, 14px);
  box-shadow: 0 .7rem 0 rgba(18,48,107,.3); animation: pop .3s cubic-bezier(.3,1.6,.6,1) both; max-width: 100%; }
.row { display: flex; align-items: center; justify-content: center; gap: clamp(10px, 3vmin, 22px); }
#winStars svg { width: clamp(52px, 15vmin, 96px); height: clamp(52px, 15vmin, 96px); }
#winStars svg.lit { animation: pop .4s cubic-bezier(.3,1.8,.6,1) both; }
.tally { font-size: clamp(30px, 9vmin, 54px); line-height: 1.1; font-variant-numeric: tabular-nums; }
.tally svg { width: clamp(36px, 10vmin, 58px); height: clamp(36px, 10vmin, 58px); }
#lostPic { display: flex; align-items: flex-end; gap: 4px; }
#podium { display: flex; align-items: flex-end; justify-content: center; gap: clamp(4px, 2vmin, 14px); }
#bigCup { width: clamp(110px, 40vmin, 220px); height: clamp(110px, 40vmin, 220px); animation: pop .6s cubic-bezier(.3,1.8,.6,1) both, nudge 1.6s .7s infinite; }
#bigMedal { width: clamp(62px, 22vmin, 118px); height: auto; transform-origin: 50% 0; animation: pop .5s .25s cubic-bezier(.3,1.8,.6,1) both, swing 2.4s .8s ease-in-out infinite; }
#champMoose { width: clamp(70px, 24vmin, 130px); height: auto; }
#champText { font-size: clamp(22px, 6.500vmin, 40px); line-height: 1.15; text-align: center; color: var(--navy); }
@keyframes swing { 25% { transform: rotate(5deg) } 75% { transform: rotate(-5deg) } }
#lostPic img { width: clamp(90px, 26vmin, 150px); height: auto; }
#lostPic svg { width: clamp(52px, 15vmin, 86px); height: clamp(52px, 15vmin, 86px); }
.next { width: clamp(84px, 22vmin, 124px); height: clamp(84px, 22vmin, 124px); background: var(--gas); color: #fff; }
.next svg { width: 56%; height: 56%; }
.cream { background: #f1e7d0; }
@media (prefers-reduced-motion: reduce) {
  #act.call, #gas.nudge, #titlePlay, .stop.here, #fuel.low, .fork.want, #place.intro, #bigCup, #bigMedal { animation: none; }
}
</style>
</head>
<body>

<script>
'use strict';
const MOOSE_SRC = 'assets/moose.webp';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- icons ---------- */
const COIN_SVG = `<circle cx="24" cy="24" r="21" fill="#e6a100"/><circle cx="24" cy="23" r="20" fill="#f6c21c"/><circle cx="24" cy="23" r="14" fill="none" stroke="#e6a100" stroke-width="3"/><path fill="#e6a100" d="m24 13 3 6.400 7 .9-5.100 4.800 1.300 6.900-6.200-3.400-6.200 3.400 1.300-6.900L14 20.300l7-.9z"/>`;
const CAN_SVG = fill => `<path d="M10 14c0-2 1.500-3.500 3.500-3.500H27l10 8.500v21c0 2-1.500 3.500-3.500 3.500h-20c-2 0-3.500-1.500-3.500-3.500z" fill="${fill}"/><path d="M15 11V6.500c0-1 .8-1.800 1.800-1.800h7c1 0 1.800.8 1.800 1.800V11h-3.200V8h-4.200v3z" fill="#12306b"/><path d="M32 8.500 41 4l2 3.500-7.500 5z" fill="#12306b"/><path d="m16 23 15 13M31 23 16 36" stroke="#fff" stroke-width="3.400" stroke-linecap="round" opacity=".9"/>`;
const STAR = lit => `<svg viewBox="0 0 48 48" class="${lit ? 'lit' : ''}"><path fill="${lit ? '#f6c21c' : '#e7dfcc'}" stroke="${lit ? '#e6a100' : '#d3c8ae'}" stroke-width="3" stroke-linejoin="round" d="m24 4 6 12.800 14 1.800-10.300 9.700 2.700 13.900L24 34.300l-12.400 6.900 2.700-13.900L4 18.600l14-1.800z"/></svg>`;
const CUP_SVG = `<path fill="none" stroke="#e6a100" stroke-width="4" d="M12 10H4.500c0 9 3 14 9 15M36 10h7.500c0 9-3 14-9 15"/><path fill="#f6c21c" d="M11 5h26c0 12-2 22-9 26v5h-8v-5C13 27 11 17 11 5z"/><path fill="#fff3a8" d="M15.500 8h4c0 7 .6 12 3 16.500-4.500-3-6.500-8-7-16.500z"/><rect x="14" y="36" width="20" height="4.500" rx="2" fill="#e6a100"/><rect x="11" y="40" width="26" height="5" rx="2" fill="#12306b"/><path fill="#e6a100" d="m24 11 2 4.300 4.700.6-3.400 3.200.9 4.600-4.200-2.300-4.200 2.300.9-4.600-3.400-3.200 4.700-.6z"/>`;
const MEDAL_SVG = `<path fill="#1668b5" d="M16 0h28l10 46H30z"/><path fill="#f6c21c" d="M52 0h28L66 46H42z"/><circle cx="48" cy="86" r="42" fill="#e6a100"/><circle cx="48" cy="84" r="40" fill="#f6c21c"/><circle cx="48" cy="84" r="29" fill="none" stroke="#e6a100" stroke-width="4"/><path fill="#e6a100" d="m48 62 6.500 13.800 15 1.900-11 10.400 2.800 14.900L48 95.700 34.700 103l2.800-14.900-11-10.400 15-1.900z"/>`;
const ARROW = dir => `<path d="${dir === 2 ? 'M94 50 58 20v18H38v24h20v18z' : dir < 0 ? 'M50 8 20 44h18v26h24V44h18z' : 'M50 92 20 56h18V30h24v26h18z'}" fill="#12306b"/>`;
const STOP_SVG = '<circle cx="24" cy="24" r="23" fill="#e8483f"/><rect x="8" y="18" width="32" height="12" rx="3" fill="#fff"/>';
const FORK_BTN = [['up', -1], ['down', 1], ['mid', 2]];
const ICON_JUMP = `<svg viewBox="0 0 100 100"><path d="M50 10 22 44h16v12h24V44h16z" fill="#fff"/><path d="M26 70h48M32 84h36" stroke="#fff" stroke-width="9" stroke-linecap="round"/></svg>`;
const ICON_HORN = `<svg viewBox="0 0 100 100"><path d="M12 42h20L78 16v68L32 58H12z" fill="#12306b"/><path d="M12 40v20" stroke="#12306b" stroke-width="12" stroke-linecap="round"/><path d="M86 34q8 16 0 32" stroke="#12306b" stroke-width="7" fill="none" stroke-linecap="round"/></svg>`;
const SOUND = on => `<svg viewBox="0 0 24 24"><path fill="#12306b" d="M3 9.500v5h4l5 4.500v-14L7 9.500z"/>${on ? '<path fill="none" stroke="#12306b" stroke-width="2.400" stroke-linecap="round" d="M15.500 8.500a5 5 0 0 1 0 7M18 6a8.500 8.500 0 0 1 0 12"/>' : '<path stroke="#f4614d" stroke-width="2.600" stroke-linecap="round" d="m15.500 9 6 6m0-6-6 6"/>'}</svg>`;
document.querySelectorAll('[data-coin]').forEach(s => s.innerHTML = COIN_SVG);
document.querySelectorAll('[data-cup]').forEach(s => s.innerHTML = CUP_SVG);
document.querySelectorAll('[data-medal]').forEach(s => s.innerHTML = MEDAL_SVG);
document.querySelectorAll('[data-can]').forEach(s => s.innerHTML = CAN_SVG(s.dataset.can === 'empty' ? '#b9b2a2' : '#f4614d'));
$('lostMoose').src = $('whoMoose').src = $('champMoose').src = MOOSE_SRC;
$('tripDot').style.backgroundImage = `url(${MOOSE_SRC})`;

/* ---------- save data ---------- */
const SAVE_KEY = 'lilla-bil-v1';
let save = { unlocked: 0, best: {}, total: 0, paint: 0, muted: false, name: '', askedName: false };
try { save = { ...save, ...JSON.parse(localStorage.getItem(SAVE_KEY) || '{}') }; } catch {}
save.bonus = save.bonus || {}; // the adventures done, by id, apart from the levels
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch {} };

/* ---------- market catalogue. Coins in save.total are now a wallet that buying spends.
   w is the season an item is sold in: left out for summer, 1 for both, 2 for winter. An item bought once works in both of its seasons ---------- */
const CATALOG = {
  vehicle: [
    { id: 'car', price: 0 }, { id: 'sport', price: 150 }, { id: 'van', price: 200 }, { id: 'tractor', price: 250 }, { id: 'icecream', price: 300 },
    { id: 'bus', price: 350 }, { id: 'fire', price: 400 }, { id: 'police', price: 450 }, { id: 'viking', price: 500 }, { id: 'rocket', price: 600 },
    { id: 'vinterbil', price: 0, w: 2 }, { id: 'spark', price: 90, w: 2 }, { id: 'snoskoter', price: 200, w: 2 }, { id: 'hundspann', price: 300, w: 2 },
    { id: 'pistmaskin', price: 420, w: 2 }, { id: 'bandvagn', price: 480, w: 2 }, { id: 'slade', price: 560, w: 2 },
  ],
  paint: [
    { id: 'red', w: 1, price: 0, color: '#e8483f' }, { id: 'blue', price: 10, color: '#1d9bf0' }, { id: 'yellow', price: 30, color: '#f6c21c' },

function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }

function buildLevel(n) {

const baseY = (L, x) => 436 + 32 * Math.sin(x * .0011 + L.ph) + 16 * Math.sin(x * .0027 + L.ph * 2);

function update(dt) {

  if (S.screen === 'finale' && (S.partyT -= dt) <= 0) { S.partyT = 1.6; if (!calm) confetti(); }
  if (S.screen === 'play') for (const s of S.L.sights) if (!s.met && s.x - S.x < 420) { s.met = true; beep(784, 0, .14, .09); beep(1175, .13, .26, .09); }
  if (S.blink < -.14) S.blink = 2 + Math.random() * 3.5;
  const L = S.L;
  for (const p of S.parts) { p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; }
  S.parts = S.parts.filter(p => p.age < p.life);

  if (S.screen === 'title' || S.screen === 'map' || S.screen === 'who') {
    S.v = 150; S.x += S.v * dt;
    if (S.x > L.finish - 900) S.x = 300;
  } else if (S.screen === 'shop') {
    S.wheel += dt * 2.4; S.v = 0;
    if (Math.random() < dt * 8) trail(-136, -40);
  } else if (S.screen === 'play') {
    const finished = S.x >= L.finish;
    const dry = S.fuel <= 0;
    const top = V_MAX * (1 + .15 * skill('turbo'));
    let target = !finished && !dry && S.gas ? top : 0;
    if (S.stunT > 0) { S.stunT -= dt; target = 0; S.v = 0; }
    if (S.slowT > 0) { S.slowT -= dt; target = Math.min(target, 190); }
    if (S.iceT > 0) { // no grip: the car slides on whatever the pedal says
      S.iceT -= dt; target = Math.max(target, S.v);
      if (Math.random() < dt * 30) S.parts.push({ x: S.x + Math.random() * 120 - 80, y: roadY(L, S.x, S.lane) - 6, vx: -40, vy: -60, life: .5, age: 0, r: 7, c: '#d8f2ff', g: 60, shape: 'stars' });
    }
    const ahead = L.obs.find(o => o.live && obstacleOnRoute(o) && o.x > S.x - 20 && o.x - S.x < 620);
    if (ahead && !ahead.soft && ahead.h < 999) target = Math.min(target, Math.max(300, top * .75)); // a little more time to jump
    S.v += clamp(target - S.v, -(finished ? 300 : dry ? 170 : COAST) * dt, ACCEL * (1 + .15 * skill('turbo')) * dt);

    if (fork && S.x > fork.a - 1100 && !S.lane) {
      if (S.activeFork !== fork) {
        S.activeFork = fork;
        for (const [id, lane] of FORK_BTN) {
          if (lane === MID && !fork.third) continue;
          const fuel = lane === fork.fuelLane || fork.both;
          const btn = $(id); btn.hidden = false; btn.classList.remove('want'); btn.classList.toggle('tri', !!fork.third);
          btn.innerHTML = `<svg viewBox="0 0 100 100">${ARROW(lane)}<g transform="translate(${lane === MID ? '0 28' : lane < 0 ? '58 52' : '58 4'}) scale(.82)">${lane === fork.dead ? STOP_SVG : fuel ? CAN_SVG('#f4614d') : COIN_SVG}</g></svg>`;
        }
      }
      const room = fork.a - 30 - S.x;
      S.v = Math.min(S.v, Math.sqrt(2 * STOP_BRAKE * Math.max(0, room)));
      if (room < 2) { S.v = 0; S.x = Math.max(S.x, fork.a - 32); }
      if (S.fuel < .3) $(FORK_BTN.find(b => b[1] === fork.fuelLane)[0]).classList.add('want');
      // a child who only knows the gas pedal still gets moving, towards the fuel
      if (room < 6 && S.gas) { S.heldAt += dt; if (S.heldAt > 2.4) { S.heldAt = 0; chooseLane(fork.fuelLane); } } else S.heldAt = 0;
    }
    const blocker = blockingCritter();
    if (blocker) {
      const room = blocker.x - 215 - S.x;
      S.v = Math.min(S.v, Math.sqrt(2 * STOP_BRAKE * Math.max(0, room)));
      if (room < 3) S.v = 0;
      if (S.v < 5 || (blocker.kind === 'slow' && room < 70)) { S.waitT += dt; if (S.waitT > 3.2) shoo(blocker); } // animals wander off by themselves too
    }
    if (S.lane && S.activeFork && S.x >= S.activeFork.b) { S.lane = 0; S.activeFork = null; }
    for (const m of L.litter) { // what a bump spilt stays where it lands
      if (m.kind === 'spill') m.age = Math.min(1, m.age + dt * 1.6);
      else if (m.vh || m.h) {
        m.x += m.vx * dt; m.h += m.vh * dt; m.vh -= 1200 * dt;
        if (m.h <= 0) { m.h = 0; m.vh = m.vh < -160 ? -m.vh * .35 : 0; m.vx = m.vh ? m.vx * .5 : 0; }
      }
    }
    const pit = S.lane && S.activeFork && S.activeFork.dead === S.lane ? S.activeFork : null;
    if (pit && S.back) { // backing away from the barrier to choose again
      S.v = -320;
      if (S.x <= pit.a - 40) { S.back = false; S.v = S.lane = 0; S.activeFork = null; }
    } else if (pit) {
      const room = pit.end - 170 - S.x;
      S.v = Math.min(S.v, Math.sqrt(2 * STOP_BRAKE * Math.max(0, room)));
      if (room < 3) { S.back = true; sfx.low(); }
    }

    const y0 = roadY(L, S.x, S.lane), y1 = roadY(L, S.x + 4, S.lane), step = S.v * dt * Math.cos(Math.atan2(y1 - y0, 4));
    S.x += step; S.wheel += step / 32;
    if (!finished) S.fuel = Math.max(0, S.fuel - Math.max(0, step) / (TANK * (1 + .25 * skill('tank') + (isWinter(L.theme) ? .1 * skill('varme') : 0))));
    if (S.fuel <= 0 && S.spare && !finished) { // the spare can tips in by itself
      S.spare--; S.fuel = .5; S.lowDone = false; sfx.can();
      for (let i = 0; i < 16; i++) spark(S.x, roadY(L, S.x, S.lane) - 100, i % 2 ? '#2fb36a' : '#f4614d');
    }
    const magnet = skill('magnet');
    for (const it of L.items) {
      if (it.got) continue;
      const near = Math.abs(it.x - S.x - 30) < 56;
      if (near && (it.lane === 0 || it.lane === S.lane)) collect(it);
      else if (magnet && it.kind === 'coin' && Math.abs(it.x - S.x - 30) < 90) { // coins fly over from the other road
        const y = roadY(L, it.x, it.lane) - it.lift, cy = roadY(L, S.x, S.lane) - 90;
        S.parts.push({ x: it.x, y, vx: S.v, vy: (cy - y) / .32, life: .32, age: 0, r: 20, c: '#f6c21c', g: 0 });
        collect(it);
      }
    }

    if (S.v > 60 && Math.random() < dt * 9) trail(S.x - 128, roadY(L, S.x, S.lane) - 40);
    for (const o of L.obs) {
      o.age += dt;
      if (o.gone) { o.x += o.vx * dt; o.y += o.vy * dt; if (o.kind !== 'slow') o.vy += 900 * dt; if (o.age > 1.3) o.live = false; continue; }
      if (!o.live) continue;
      if ((o.kind === 'roller' || o.kind === 'ball') && o.x - S.x < 1000 && !blockingCritter()) { o.rolling = true; }
      if (o.kind === 'slow') { if (o.x - S.x < 740) o.x += 120 * dt; if (o.x >= o.end) shoo(o); }
      if (o.rolling) { o.x -= ROLL * dt; o.spin = (o.spin || 0) - ROLL * dt / 38; }
      if (o.h === 999 || !obstacleOnRoute(o)) continue;
      const dx = Math.abs(o.x - S.x - 20);

    }
    const wet = L.obs.find(o => o.live && (o.kind === 'puddle' || (o.kind === 'ice' && !skill('dubbar'))) && obstacleOnRoute(o) && o.x > S.x && o.x - S.x < WET_WARN);
    if (wet && !wet.warned) { wet.warned = true; beep(880, 0, .12, .07, 'sine'); beep(880, .16, .12, .07, 'sine'); }
    $('gas').classList.toggle('ease', !!wet && S.v > SAFE_SPEED);
    if (S.fuel < .25 && !S.lowDone && !finished) { S.lowDone = true; sfx.low(); }

    if (dry && !finished && S.v < 1) {

    }

    }

    $('spare').hidden = !S.spare;
    const horn = !!blockingCritter(), near = horn || L.obs.some(o => o.live && !o.gone && o.h < 999 && !o.soft && obstacleOnRoute(o) && o.x > S.x && o.x - S.x < 520);
    const actBtn = $('act');

    }

    $('tripDot').style.left = clamp(S.x / L.finish, 0, 1) * 100 + '%';
    $('gas').classList.toggle('nudge', S.v < 5 && !S.gas && !$('gas').classList.contains('down') && !(S.activeFork && !S.lane && S.x > S.activeFork.a - 60));
  }
  if (S.hop > 0 || S.hopV) { S.hop += S.hopV * dt; S.hopV -= 900 * dt; if (S.hop <= 0) { S.hop = 0; S.hopV = 0; } }

}

      for (let i = vw + 40; i >= 0; i -= 28) g.lineTo(i, top + ex * .3 + 118 + 16 * Math.sin(i * .009 + S.t * .3 + b));

function shapePath(shape, x, y, r) {

  if (shape === 'hearts') { g.moveTo(x, y + r); g.bezierCurveTo(x - r * 1.7, y - r * .3, x - r * .7, y - r * 1.3, x, y - r * .4); g.bezierCurveTo(x + r * .7, y - r * 1.3, x + r * 1.7, y - r * .3, x, y + r); }

function draw() {
  const L = S.L, T = L.theme, car = roadY(L, S.x, S.lane);
  const ahead = clamp(vw * .32, 230, 460);
  const camX = S.x - ahead;
  const ex = (vh - 720) / 2;
  const camY = (car - baseY(L, S.x)) * .3 + baseY(L, S.x) - 436 - ex;
  g.setTransform(dpr * sc, 0, 0, dpr * sc, 0, 0);
  drawSky(T, camX);

  g.save(); g.translate(-camX, -camY);
  const leaf = T.name === 'autumn' ? '#e8702a' : '#6fb54a';
  const bottom = camY + vh + 60;
  // back layer: the top road sits on a paler hill, the bottom road runs in front of it
  strip(L, camX, -1, bottom); g.fillStyle = T.back; g.fill();
  for (const s of L.scenery) {
    if (s.x < camX - 360 || s.x > camX + vw + 360) continue;
    if (Math.abs(s.x - L.finish) < 240) continue;
    g.save(); g.translate(s.x, roadY(L, s.x, -1) + 4);
    const c = { leaf: s.x % 3 < 1.5 ? leaf : '#d9a02c', seed: s.x };
    if (s.flip) g.scale(-1, 1);
    if (s.h) g.scale(s.h, s.h);
    SPRITE[s.kind](c); g.restore();
  }
  for (const s of L.sights) if (s.x > camX - 360 && s.x < camX + vw + 360) sightName(L, s, camY);
  for (const f of L.forks) {
    drawRoad(L, T, camX, -1, f.a, f.dead === -1 ? f.end : f.b);
    if (f.third) drawRoad(L, T, camX, MID, f.a, f.dead === MID ? f.end : f.b);
  }
  strip(L, camX, 1, bottom); g.fillStyle = T.ground; g.fill();
  let from = camX - 40;
  for (const f of L.forks) if (f.dead === 1) { drawRoad(L, T, camX, 1, from, f.end); from = f.b; }
  drawRoad(L, T, camX, 1, from, camX + vw + 40);

  for (const f of L.forks) { // sign pointing both ways at each junction
    const x = f.a - 110, y = baseY(L, x);
    rect(0, x - 5, y - 110, 10, 112, '#8d95a5');
    g.fillStyle = '#1d9bf0'; roundR(x - 34, y - 164, 68, 68, 12); g.fill();
    g.fillStyle = '#fff'; rtri(x, y - 156, 16, y - 134 + 0); rtri(x, y - 104, 16, y - 126);
    if (f.third) { g.beginPath(); g.moveTo(x + 22, y - 130); g.lineTo(x + 4, y - 142); g.lineTo(x + 4, y - 118); g.fill(); }
    if (f.dead) drawBarrier(f.end, roadY(L, f.end, f.dead));
  }
  drawFinish(L.finish + 60, baseY(L, L.finish + 60));
  for (const m of L.litter) {
    if (m.x < camX - 120 || m.x > camX + vw + 120) continue;
    const y = roadY(L, m.x, m.lane);
    if (m.kind === 'coin') { drawCoin(m.x, y - 4 - m.h, m.phase); continue; }
    const s = smooth(m.age); // a petrol puddle, with the rainbow sheen petrol has on a wet road
    g.fillStyle = '#2d3048'; g.beginPath(); g.ellipse(m.x, y + 14, 92 * s, 15 * s, 0, 0, 7); g.ellipse(m.x - 66 * s, y + 21, 38 * s, 8 * s, 0, 0, 7); g.fill();
    g.fillStyle = '#7a5cd6'; g.beginPath(); g.ellipse(m.x - 22, y + 12, 44 * s, 6 * s, 0, 0, 7); g.fill();
    g.fillStyle = '#22d3a6'; g.beginPath(); g.ellipse(m.x + 18, y + 15, 34 * s, 4 * s, 0, 0, 7); g.fill();
  }

  for (const o of L.obs) if (o.live && o.x > camX - 200 && o.x < camX + vw + 200) drawObstacle(L, o);
  for (const o of L.obs) if ((o.kind === 'puddle' || o.kind === 'ice') && o.x - WET_WARN > camX - 120 && o.x - WET_WARN < camX + vw + 120) drawWetSign(o.x - WET_WARN, baseY(L, o.x - WET_WARN), o.kind === 'ice' || T.snowy);
  for (const it of L.items) {

    const y = roadY(L, it.x, it.lane) - it.lift;

  for (const p of S.parts) {

    g.globalAlpha = a; drawPart(p, a);
  }
  g.globalAlpha = 1;
  g.restore();

  if (T.fall && !calm) {
    while (S.fall.length < 46) S.fall.push({ x: Math.random() * 1600, y: Math.random() * 900, s: 2 + Math.random() * 4, p: Math.random() * 6 });
    S.fall.forEach((f, i) => {
