<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f8f3e6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Lilla Bil</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-512.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/Baloo2-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: 'Baloo 2'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url(assets/fonts/Baloo2-latin-ext.woff2) format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'Baloo 2'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url(assets/fonts/Baloo2-latin.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212; }
body { margin: 0; background: #f8f3e6; }
[hidden] { display: none !important; }
</style>
<style>
/* A picture-book road trip through Sweden: the whole screen is the scene, controls are chunky toys,
   and nothing needs reading. Single deliberate look, shared letter colours with Lilla Piano. */
:root {
  --navy: #12306b; --sun: #f6c21c; --coral: #f4614d; --teal: #22b3a6; --pink: #f2577d;
  --gas: #2fb36a; --gas-dark: #1c7f49; --paper: #fffaf0; --sky: #8fd6f5;
  --display: 'Baloo 2', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif;
  --gap: max(16px, env(safe-area-inset-left, 0px));
  --gap-r: max(16px, env(safe-area-inset-right, 0px));
}
html, body { height: 100%; background: var(--sky); overflow: hidden; color: var(--navy); }
#app { position: fixed; inset: 0; overflow: hidden; font-family: var(--display); font-weight: 800;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer;
  touch-action: none; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 4px solid var(--navy); outline-offset: 3px; }
svg { display: block; }

/* toy buttons */
.toy { display: grid; place-items: center; border-radius: 999px; background: var(--paper);
  box-shadow: 0 .42rem 0 rgba(18,48,107,.28); transition: transform .08s; }
.toy:active { transform: translateY(.3rem); box-shadow: 0 .12rem 0 rgba(18,48,107,.28); }
.small { flex: none; width: clamp(46px, 11vmin, 62px); height: clamp(46px, 11vmin, 62px); }
#spare { width: clamp(24px, 6vmin, 32px); height: clamp(24px, 6vmin, 32px); flex: none; }
.small svg { width: 58%; height: 58%; }

/* HUD */
#hud { position: absolute; left: var(--gap); right: var(--gap-r); top: max(12px, env(safe-area-inset-top, 0px));
  display: flex; align-items: center; gap: clamp(8px, 2vw, 18px); pointer-events: none; }
#hud > * { pointer-events: auto; }
#fuel { display: flex; align-items: center; gap: 8px; background: var(--paper); border-radius: 999px;
  padding: 5px 14px 5px 8px; box-shadow: 0 .3rem 0 rgba(18,48,107,.22); }
#fuel svg { width: clamp(32px, 8vmin, 44px); height: clamp(32px, 8vmin, 44px); }
#fuelBar { width: clamp(64px, 22vw, 230px); height: clamp(18px, 4.6vmin, 26px); border-radius: 99px;
  background: #e7dfcc; overflow: hidden; }
#fuelFill { height: 100%; width: 100%; border-radius: 99px; background: var(--gas); transition: background .3s; }
#fuel.low { animation: wiggle .55s infinite; }
#fuel.low #fuelFill { background: var(--coral); }
@keyframes wiggle { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-2.4deg) scale(1.04) } 75% { transform: rotate(2.4deg) scale(1.04) } }
#trip { flex: 1; min-width: 30px; margin-inline: 8px; height: 12px; border-radius: 9px; background: rgba(255,250,240,.75); position: relative; }
#tripDot { position: absolute; top: 50%; left: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px;
  background-size: contain; background-repeat: no-repeat; background-position: center; }
#tripEnd { position: absolute; right: -6px; top: -7px; width: 26px; height: 26px; }
#coins { display: flex; align-items: center; gap: 6px; background: var(--paper); border-radius: 999px;
  padding: 2px 16px 2px 6px; box-shadow: 0 .3rem 0 rgba(18,48,107,.22);
  font-size: clamp(24px, 6vmin, 34px); line-height: 1.3; font-variant-numeric: tabular-nums; }
#coins svg { width: clamp(30px, 7.6vmin, 42px); height: clamp(30px, 7.6vmin, 42px); }
#coins.bump { animation: bump .18s; }
@keyframes bump { 50% { transform: scale(1.16) } }

@media (max-width: 520px) { #trip, #fullH { display: none } #hud { justify-content: space-between } }

/* pedals */
#gas { position: absolute; right: var(--gap-r); bottom: max(18px, calc(env(safe-area-inset-bottom, 0px) + 10px));
  width: clamp(124px, 34vmin, 230px); height: clamp(124px, 34vmin, 230px); border-radius: 30%;
  background: var(--gas); box-shadow: 0 .8rem 0 var(--gas-dark), 0 1.1rem 1.4rem rgba(0,0,0,.2);
  display: grid; place-items: center; transition: transform .07s, box-shadow .07s; }
#gas svg { width: 66%; height: 66%; }
#gas.down { transform: translateY(.55rem) scale(.97); box-shadow: 0 .25rem 0 var(--gas-dark); }
#gas.nudge { animation: nudge 1s infinite; }
@keyframes nudge { 50% { transform: scale(1.07) } }

#act { position: absolute; left: var(--gap); bottom: max(18px, calc(env(safe-area-inset-bottom, 0px) + 10px));
  width: clamp(96px, 26vmin, 170px); height: clamp(96px, 26vmin, 170px); border-radius: 50%; background: #1d9bf0;
  box-shadow: 0 .7rem 0 #1270b5, 0 1rem 1.2rem rgba(0,0,0,.18); display: grid; place-items: center; transition: transform .07s, box-shadow .07s; }
#act svg { width: 66%; height: 66%; pointer-events: none; }
#act:active { transform: translateY(.45rem); box-shadow: 0 .2rem 0 #1270b5; }
#act.horn { background: var(--sun); box-shadow: 0 .7rem 0 #c79a0c, 0 1rem 1.2rem rgba(0,0,0,.18); }
#act.call { animation: nudge .6s infinite; }

.fork { position: absolute; left: var(--fork-x, 47%); width: clamp(104px, 27vmin, 172px); height: clamp(104px, 27vmin, 172px);
  margin-left: calc(clamp(104px, 27vmin, 172px) / -2); border-radius: 50%; background: var(--paper);
  border: clamp(6px, 1.4vmin, 10px) solid var(--sun); display: grid; place-items: center; position: absolute;
  box-shadow: 0 .6rem 0 rgba(18,48,107,.28); animation: pop .28s cubic-bezier(.3,1.6,.6,1) both; }
.fork svg { width: 86%; height: 86%; }
#up { top: 13%; } #down { bottom: 7%; }
.fork.want { border-color: var(--coral); animation: pop .28s cubic-bezier(.3,1.6,.6,1) both, nudge .8s .3s infinite; }
@keyframes pop { from { transform: scale(.3); opacity: 0 } }
@media (max-aspect-ratio: 1/1) { #up { top: 24% } #down { bottom: 30% } }

/* screens */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: clamp(8px, 3vmin, 22px); padding-block: 14px; padding-left: var(--gap); padding-right: var(--gap-r); text-align: center; }
.dim { background: rgba(18,48,107,.34); }
#logo { display: flex; align-items: center; justify-content: center; gap: .14em; white-space: pre; font-size: clamp(52px, 17vmin, 124px); line-height: .9; letter-spacing: -.01em;
  text-shadow: 0 .05em 0 var(--paper), .03em 0 0 var(--paper), -.03em 0 0 var(--paper), 0 -.03em 0 var(--paper); }
#logo img { height: 1.24em; width: auto; margin-right: .06em; }
#title { justify-content: flex-start; padding-top: clamp(14px, 6vh, 64px); }
.play { width: clamp(104px, 28vmin, 170px); height: clamp(104px, 28vmin, 170px); background: var(--coral); }
.play svg { width: 54%; height: 54%; margin-left: 7%; }
#titlePlay { animation: nudge 1.3s infinite; }

.corner { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); left: var(--gap); right: var(--gap-r); display: flex; justify-content: space-between; pointer-events: none; }
.corner > * { pointer-events: auto; }
#hello { position: absolute; left: var(--gap); top: var(--hello-y, 30%); transform: translateY(-100%); max-width: 44vw; padding: .1em .7em; border-radius: 26px 26px 26px 6px;
  background: var(--paper); font-size: clamp(20px, 6vmin, 38px); line-height: 1.3; overflow-wrap: anywhere; box-shadow: 0 .3rem 0 rgba(18,48,107,.22); animation: pop .4s cubic-bezier(.3,1.6,.6,1) both; }
#whoForm { font-size: clamp(22px, 6vmin, 34px); }
#whoMoose { width: clamp(70px, 20vmin, 120px); height: auto; }
#whoName { font: inherit; color: inherit; text-align: center; width: min(70vw, 9em); padding: .1em .4em; border: 4px solid var(--sun); border-radius: 20px; background: #fff;
  outline: 0; touch-action: auto; user-select: text; -webkit-user-select: text; }
#map { background: linear-gradient(#8fd6f5, #d9f4e6 62%, #8ccf7b); justify-content: center; }
#mapTop { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); left: var(--gap); right: var(--gap-r);
  display: flex; align-items: center; justify-content: space-between; }
#stops { display: grid; grid-template-columns: repeat(8, auto); gap: clamp(5px, 1.6vmin, 16px); margin-top: clamp(30px, 8vh, 60px); }
.spot { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.placeName { font-size: clamp(12px, 2.1vw, 19px); line-height: 1.1; color: var(--navy); white-space: nowrap; }
#place { position: absolute; left: 0; top: calc(100% + 8px); padding: .05em .7em; border-radius: 12px; background: #1668b5; color: #fff; border: 2px solid #fff;
  font-size: clamp(17px, 4.6vmin, 28px); line-height: 1.3; white-space: nowrap; transform-origin: 0 0; pointer-events: none; box-shadow: 0 .2rem 0 rgba(18,48,107,.3); }
#place.intro { animation: placeIn 3s both; }
@keyframes placeIn { 0% { transform: scale(.4); opacity: 0 } 8%, 70% { transform: scale(1.7); opacity: 1 } 100% { transform: scale(1) } }
.stop { --s: min(10vw, 19vh); overflow: hidden; width: var(--s); height: var(--s); max-width: 100%; border-radius: 50%; position: relative;
  border: clamp(4px, 1vmin, 7px) solid var(--paper); box-shadow: 0 .4rem 0 rgba(18,48,107,.26); color: #fff;
  font-size: calc(var(--s) * .26); line-height: 1; display: grid; place-items: start center; text-shadow: 0 .06em 0 rgba(18,48,107,.6); }
.stop canvas { width: 100%; height: 100%; }
.stop .num { position: relative; margin-top: 3%; padding: 0 .36em; border-radius: 99px; background: var(--navy); text-shadow: none; }
.stop[disabled] { filter: grayscale(.75) brightness(.92); cursor: default; }
.stop .stars { position: absolute; left: 0; right: 0; bottom: -2%; display: flex; justify-content: center; gap: 1px; }
.stop .stars svg { width: 26%; height: auto; }
.stop.here { animation: nudge 1.1s infinite; }
@media (max-aspect-ratio: 1/1) { #stops { grid-template-columns: repeat(4, auto); } .stop { --s: min(20vw, 11.500vh); } .placeName { font-size: clamp(12px, 3.3vw, 18px); } }
#shopBtn { display: flex; align-items: center; gap: .4em; margin-top: clamp(4px, 1.5vmin, 12px); padding: .25em .9em .25em .5em;
  border-radius: 999px; background: var(--coral); box-shadow: 0 .4rem 0 #b83f2f; }
#shopBtn svg { width: clamp(44px, 12vmin, 70px); height: clamp(44px, 12vmin, 70px); }
#shopBtn.nudge { animation: nudge 1.2s infinite; }

/* market stall: awning on top, the car on show, wares on the counter */
#shop { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); grid-template-rows: auto minmax(0, 1fr); gap: 0 12px;
  padding-block: 0 10px; text-align: left; justify-content: stretch; align-items: stretch;
  background: linear-gradient(#fdeecb, #f7dca4); }
#awning { grid-column: 1 / -1; margin-left: calc(var(--gap) * -1); margin-right: calc(var(--gap-r) * -1);
  height: clamp(66px, 15vmin, 92px); padding: 0 var(--gap-r) 0 var(--gap); display: flex; align-items: center; justify-content: space-between;
  background: repeating-linear-gradient(90deg, #e8483f 0 56px, #fffaf0 56px 112px); box-shadow: 0 .3rem 0 rgba(18,48,107,.16); }
#wallet { display: flex; align-items: center; gap: 6px; background: var(--paper); border-radius: 99px; padding: 2px 16px 2px 6px;
  font-size: clamp(24px, 6vmin, 34px); line-height: 1.3; font-variant-numeric: tabular-nums; box-shadow: 0 .3rem 0 rgba(18,48,107,.22); }
#wallet svg { width: clamp(30px, 7.6vmin, 42px); height: clamp(30px, 7.6vmin, 42px); }
#wallet.broke { animation: wiggle .3s 2; }
#stage { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; }
#shopCar { position: relative; inset: auto; flex: 1; min-height: 0; width: 100%; height: auto; }
#buy { min-height: clamp(62px, 15vmin, 88px); flex: none; display: grid; place-items: center; }
#buyBtn { display: flex; align-items: center; gap: 8px; padding: .1em .8em .1em .45em; border-radius: 999px; background: var(--gas); color: #fff;
  font-size: clamp(30px, 8vmin, 46px); line-height: 1.3; box-shadow: 0 .4rem 0 var(--gas-dark); font-variant-numeric: tabular-nums;
  animation: pop .22s cubic-bezier(.3,1.6,.6,1) both, nudge 1.1s .3s infinite; }
#buyBtn svg { width: 1.2em; height: 1.2em; }
#buyBtn.poor { background: #b9b2a2; box-shadow: 0 .4rem 0 #8e8878; animation: pop .22s both; }
#counter { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding-top: 10px; }
#tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; flex: none; }
.tab { height: clamp(52px, 13vmin, 76px); border-radius: 20px; background: var(--paper); display: grid; place-items: center;
  box-shadow: 0 .25rem 0 rgba(18,48,107,.2); }
.tab svg { width: clamp(30px, 8vmin, 50px); height: clamp(30px, 8vmin, 50px); }
.tab.on { background: var(--navy); box-shadow: 0 .25rem 0 #0a1c44; }
#wares { flex: 1; min-height: 0; overflow-y: auto; touch-action: pan-y; display: grid; align-content: start;
  grid-template-columns: repeat(auto-fill, minmax(clamp(82px, 21vmin, 124px), 1fr)); grid-auto-rows: clamp(88px, 22vmin, 130px); gap: 10px; padding: 3px 3px 12px; }
.ware { position: relative; border-radius: 22px; background: var(--paper); box-shadow: 0 .3rem 0 rgba(18,48,107,.2);
  border: 4px solid transparent; display: grid; place-items: center; touch-action: pan-y; overflow: hidden; }
.ware canvas { position: static; width: 78%; height: 78%; object-fit: contain; }
.ware.sel { border-color: var(--sun); }
.ware.worn { border-color: var(--gas); }
.ware .tag { position: absolute; left: 0; right: 0; bottom: 3px; display: flex; justify-content: center; align-items: center; gap: 2px;
  font-size: clamp(14px, 3.4vmin, 19px); line-height: 1.2; font-variant-numeric: tabular-nums; }
.ware .tag svg { width: 1.05em; height: 1.05em; }
.ware.priced canvas { transform: translateY(-9%); }
.ware .pips { position: absolute; top: 6px; left: 0; right: 0; display: flex; justify-content: center; gap: 4px; }
.ware .pips i { width: 10px; height: 10px; border-radius: 50%; background: #e7dfcc; }
.ware .pips i.on { background: var(--gas); }
.ware .tick { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; }
@media (max-aspect-ratio: 1/1) { #shop { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 2fr) minmax(0, 3fr); } }

.card { background: var(--paper); border-radius: 36px; padding: clamp(10px, 3vmin, 24px) clamp(18px, 6vmin, 44px);
  display: flex; flex-direction: column; align-items: center; gap: clamp(4px, 2vmin, 14px);
  box-shadow: 0 .7rem 0 rgba(18,48,107,.3); animation: pop .3s cubic-bezier(.3,1.6,.6,1) both; max-width: 100%; }
.row { display: flex; align-items: center; justify-content: center; gap: clamp(10px, 3vmin, 22px); }
#winStars svg { width: clamp(52px, 15vmin, 96px); height: clamp(52px, 15vmin, 96px); }
#winStars svg.lit { animation: pop .4s cubic-bezier(.3,1.8,.6,1) both; }
.tally { font-size: clamp(30px, 9vmin, 54px); line-height: 1.1; font-variant-numeric: tabular-nums; }
.tally svg { width: clamp(36px, 10vmin, 58px); height: clamp(36px, 10vmin, 58px); }
#lostPic { display: flex; align-items: flex-end; gap: 4px; }
#lostPic img { width: clamp(90px, 26vmin, 150px); height: auto; }
#lostPic svg { width: clamp(52px, 15vmin, 86px); height: clamp(52px, 15vmin, 86px); }
.next { width: clamp(84px, 22vmin, 124px); height: clamp(84px, 22vmin, 124px); background: var(--gas); color: #fff; }
.next svg { width: 56%; height: 56%; }
.cream { background: #f1e7d0; }
@media (prefers-reduced-motion: reduce) {
  #act.call, #gas.nudge, #titlePlay, .stop.here, #fuel.low, .fork.want, #place.intro { animation: none; }
}
</style>
</head>
<body>

<div id="app">
  <canvas id="c" aria-label="Moose driving a car along a road"></canvas>

  <div id="hud" hidden>
    <button class="toy small" id="home" aria-label="Back to the map"><svg viewBox="0 0 24 24"><path fill="#12306b" d="M12 3 2.5 11.5h3V21h5v-6h3v6h5v-9.500h3z"/></svg></button>
    <div id="fuel" role="img" aria-label="Fuel"><svg viewBox="0 0 48 48" data-can></svg><div id="fuelBar"><div id="fuelFill"></div></div><svg id="spare" viewBox="0 0 48 48" data-can hidden></svg></div>
    <div id="trip"><div id="tripDot"></div><svg id="tripEnd" viewBox="0 0 24 24"><path fill="#12306b" d="M5 2h2.500v20H5z"/><path fill="#f4614d" d="M7.500 3H21l-3.500 4.500L21 12H7.500z"/></svg></div>
    <div id="coins"><svg viewBox="0 0 48 48" data-coin></svg><span id="coinN">0</span></div>
    <button class="toy small" id="mute" aria-label="Sound on or off"></button>
    <button class="toy small full" id="fullH"></button>
    <div id="place"></div>
  </div>

  <button id="gas" aria-label="Gas pedal, hold to drive" hidden><svg viewBox="0 0 100 100"><rect x="14" y="10" width="72" height="80" rx="16" fill="#fff" opacity=".94"/><g fill="#2fb36a"><rect x="26" y="24" width="48" height="9" rx="4.500"/><rect x="26" y="45" width="48" height="9" rx="4.500"/><rect x="26" y="66" width="48" height="9" rx="4.500"/></g></svg></button>
  <button id="act" aria-label="Jump" hidden></button>
  <button class="fork" id="up" aria-label="Take the top road" hidden></button>
  <button class="fork" id="down" aria-label="Take the bottom road" hidden></button>

  <section id="title" class="screen">
    <div class="corner">
      <button class="toy small" id="whoBtn" aria-label="Who is playing?"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.500" fill="#12306b"/><path fill="#12306b" d="M3.500 21c.6-5 4-7.500 8.500-7.500s7.900 2.500 8.500 7.500z"/></svg></button>
      <span></span>
      <button class="toy small full" id="fullT"></button>
    </div>
    <button id="hello" hidden></button>
    <div id="logo" role="img" aria-label="Lilla Bil"><img src="assets/logo.webp" alt=""><span><span style="color:#f4614d">L</span><span style="color:#e6ae0a">i</span><span style="color:#22b3a6">l</span><span style="color:#1fa89a">l</span><span style="color:#f2577d">a</span> <span style="color:#12306b">Bil</span></span></div>
    <button class="toy play" id="titlePlay" aria-label="Play"><svg viewBox="0 0 24 24"><path fill="#fff" d="M6 3.800c0-1.200 1.300-2 2.400-1.300l13 8.200c1 .6 1 2 0 2.600l-13 8.200C7.300 22.200 6 21.400 6 20.200z"/></svg></button>
  </section>

  <section id="map" class="screen" hidden>
    <div id="mapTop">
      <div id="coinsMap" style="display:flex;align-items:center;gap:6px;font-size:clamp(24px,6vmin,34px);background:var(--paper);border-radius:99px;padding:2px 16px 2px 6px"><svg viewBox="0 0 48 48" data-coin style="width:38px;height:38px"></svg><span id="totalN">0</span></div>
      <div class="row" style="gap:10px"><button class="toy small" id="mute2" aria-label="Sound on or off"></button><button class="toy small full" id="fullM"></button></div>
    </div>
    <div id="stops"></div>
    <button class="toy" id="shopBtn" aria-label="Market"><svg viewBox="0 0 48 48"><path fill="#fffaf0" d="M7 21h34v21H7z"/><path fill="#12306b" d="M11 26h11v16H11z"/><path fill="#1d9bf0" d="M27 26h10v9H27z"/><path fill="#fffaf0" d="M4 19 9 6h30l5 13a6.700 6.700 0 0 1-13 0 6.700 6.700 0 0 1-14 0 6.700 6.700 0 0 1-13 0z"/><path fill="#f6c21c" d="M17 19 19 6h10l2 13a7 7 0 0 1-14 0z"/></svg><svg viewBox="0 0 48 48" data-coin></svg></button>
  </section>

  <section id="shop" class="screen" hidden>
    <div id="awning">

/* ---------- levels ----------
   Fuel burns by distance, and a full tank reaches 8600. Forks repeat every 4100, so a missed can is
   always fine; only skipping two in a row runs dry, and levels 1-4 are guarded by cans on the main road. */
const TANK = 8600, STRETCH = 2200, FORK_LEN = 1900, RAMP = 420, TOP_RISE = 175, LOW_DROP = 120;
const SPECS = [
  { forks: 0, long: 7600 },
  { forks: 1, bothFuel: true, mainFuel: 1, obs: ['hump'] },
  { forks: 2, mainFuel: 1, obs: ['critter'] },
  { forks: 3, mainFuel: 1, obs: ['critter', 'log'] },
  { forks: 3, obs: ['critter', 'cones', 'puddle', 'hump'] },
  { forks: 4, obs: ['log', 'puddle', 'ball', 'ramp'], coinLog: true },
  { forks: 4, obs: ['critter', 'rock', 'roller'], coinLog: true },
  { forks: 5, obs: ['slow', 'hump', 'ball'], coinLog: true },
  { forks: 4, obs: ['critter', 'log', 'puddle', 'ball', 'ramp'], coinLog: true },
  { forks: 5, obs: ['critter', 'rock', 'ramp', 'roller'], coinLog: true },
  { forks: 5, obs: ['slow', 'hump', 'roller'], coinLog: true },
  { forks: 5, obs: ['critter', 'rock', 'puddle', 'ball'], coinLog: true },
  { forks: 5, obs: ['critter', 'log', 'ice', 'roller'], coinLog: true },
  { forks: 5, obs: ['slow', 'hump', 'ball'], coinLog: true },
  { forks: 5, obs: ['critter', 'rock', 'ice', 'ramp', 'roller'], coinLog: true },
  { forks: 5, obs: ['critter', 'log', 'ice', 'ramp', 'ball'], coinLog: true },
];
/* Hits never stop a run: a bump spills a little gas and a few coins, then the road is clear again.
   h is how high the car must be to clear it, w its width on the road. Soft ones never hurt: they are
   fun things to drive over, and a car that jumps them anyway earns the coin. A slow vehicle leaves
   the road by itself, so no other obstacle may share a stretch between its start and end. */
const OBST = { critter: { at: 700, h: 999, w: 90 }, slow: { at: 700, h: 999, w: 200, run: 1100 }, hump: { at: 420, h: 1, w: 90, soft: true },
  log: { at: 1060, h: 50, w: 110 }, rock: { at: 1060, h: 70, w: 90 }, cones: { at: 1060, h: 50, w: 120 },
  ramp: { at: 1460, h: 40, w: 110, soft: true }, puddle: { at: 1740, h: 18, w: 150, soft: true }, ice: { at: 1740, h: 18, w: 190, soft: true },
  roller: { at: 2000, h: 70, w: 76 }, ball: { at: 2000, h: 70, w: 76 } };
const JUMP = 560, BUMP_FUEL = .04, BUMP_COINS = 3, ROLL = 200;

function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }

function buildLevel(n) {
  const spec = SPECS[n], rand = rng(n * 7919 + 13), items = [], forks = [], obs = [];
  const place = (kind, x, lane = 0) => obs.push({ kind, x, lane, ...OBST[kind], end: x + (OBST[kind].run || 0), live: true, age: 0 });
  const coinRow = (x0, count, lane, gap = 92) => {
    for (let i = 0; i < count; i++) items.push({ kind: 'coin', x: x0 + i * gap, lane, lift: 62 + Math.sin(i / Math.max(1, count - 1) * Math.PI) * 56 });
  };
  const can = (x, lane) => items.push({ kind: 'can', x, lane, lift: 66 });
  let x = 900;
  if (!spec.forks) {
    for (let i = 0; x < spec.long; i++, x += 900) { coinRow(x, 5, 0); if (i % 4 === 3) can(x + 620, 0); }
  }
  for (let i = 0; i < spec.forks; i++) {
    coinRow(x + 250, 5, 0); coinRow(x + 1250, 5, 0);
    if (spec.mainFuel && i % spec.mainFuel === 0) can(x + 900, 0);
    for (const kind of spec.obs || []) {
      place(kind, x + OBST[kind].at);
      if (kind === 'ramp') for (let j = 0; j < 4; j++) items.push({ kind: 'coin', x: x + 1620 + j * 80, lane: 0, lift: 230 + 50 * Math.sin(j * 1.05) });
    }
    x += STRETCH;
    const a = x, b = a + FORK_LEN, m = (a + b) / 2, fuelLane = rand() < .5 ? -1 : 1, coinLane = -fuelLane;

  for (const f of L.forks) { // sign pointing both ways at each junction
    const x = f.a - 110, y = baseY(L, x);
    rect(0, x - 5, y - 110, 10, 112, '#8d95a5');
    g.fillStyle = '#1d9bf0'; roundR(x - 34, y - 164, 68, 68, 12); g.fill();
    g.fillStyle = '#fff'; rtri(x, y - 156, 16, y - 134 + 0); rtri(x, y - 104, 16, y - 126);
  }
  drawFinish(L.finish + 60, baseY(L, L.finish + 60));

  for (const o of L.obs) if (o.live && o.x > camX - 200 && o.x < camX + vw + 200) drawObstacle(L, o);
  for (const it of L.items) {
    if (it.got || it.x < camX - 80 || it.x > camX + vw + 80) continue;
    const y = roadY(L, it.x, it.lane) - it.lift;
    if (it.kind === 'coin') drawCoin(it.x, y, it.x * .01); else drawCan(it.x, y - 8);
  }
  const slope = Math.atan2(roadY(L, S.x + 40, S.lane) - roadY(L, S.x - 40, S.lane), 80);
  drawCar(S.x, car, slope + (S.iceT > 0 && !calm ? Math.sin(S.t * 13) * .06 : 0));
  for (const p of S.parts) {
    const a = 1 - p.age / p.life;
    g.globalAlpha = a; drawPart(p, a);
  }
  g.globalAlpha = 1;
  g.restore();

  if (T.fall && !calm) {
    while (S.fall.length < 46) S.fall.push({ x: Math.random() * 1600, y: Math.random() * 900, s: 2 + Math.random() * 4, p: Math.random() * 6 });
    S.fall.forEach((f, i) => {
      f.y += (.5 + f.s * .14); f.x -= S.v * .006 + Math.sin(S.t + f.p) * .5;
      if (f.y > vh + 10) f.y = -10;
      if (f.x < -10) f.x = vw + 10;
      g.fillStyle = T.fall[i % T.fall.length]; g.beginPath(); g.ellipse(f.x, f.y, f.s + 1, f.s, f.p + S.t, 0, 7); g.fill();
    });
  }
}

let last = 0;
function frame(now) {
  requestAnimationFrame(frame); // scheduled first, so one bad frame can't stop the game
  const dt = Math.min((now - last) / 1000 || 0, .05); last = now;
  update(dt);
  if (S.screen === 'shop') drawShopCar(); else { g = mainCtx; draw(); }
}

/* ---------- map ---------- */
function renderMap() {
  $('totalN').textContent = save.total;
  $('stops').innerHTML = THEMES.map((T, i) => {
    const locked = i > save.unlocked, stars = save.best[i] || 0;
    return `<div class="spot"><button class="stop ${i === save.unlocked ? 'here' : ''}" data-n="${i}" ${locked ? 'disabled' : ''} aria-label="${T.place}, level ${i + 1}${locked ? ', locked' : ''}" style="background:linear-gradient(${T.sky[0]} 62%, ${T.ground} 63%)"><canvas width="160" height="160"></canvas><span class="num">${i + 1}</span><span class="stars">${stars ? [0, 1, 2].map(s => STAR(s < stars)).join('') : ''}</span></button><span class="placeName">${T.place}</span></div>`;
  }).join('');
  $('stops').querySelectorAll('canvas').forEach((c, i) => stopIcon(c, THEMES[i]));
  $('shopBtn').classList.toggle('nudge', cheapestWant() <= save.total);
}

function stopIcon(c, T) { // each stop shows what is up the road there
  const was = g; g = c.getContext('2d');
  g.translate(80, 128); g.scale(T.iconS, T.iconS); SPRITE[T.icon]({ leaf: T.name === 'autumn' ? '#e8702a' : '#6fb54a', seed: 3 });
  g = was;
}

/* ---------- market ---------- */
const shopCv = $('shopCar'), shopCtx = shopCv.getContext('2d');
let shopW = 1, shopH = 1;
function resizeShop() {
  const r = shopCv.getBoundingClientRect();
  shopW = Math.max(1, r.width); shopH = Math.max(1, r.height);
  shopCv.width = shopW * dpr; shopCv.height = shopH * dpr;
}
addEventListener('resize', () => { if (S.screen === 'shop') resizeShop(); });
function drawShopCar() {
  g = shopCtx;
  const k = Math.min(shopW / 340, shopH / 300);
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, shopW, shopH);
  g.translate(shopW / 2 + 16 * k, shopH - 18 * k); g.scale(k, k);
  g.fillStyle = '#d9b77a'; g.beginPath(); g.ellipse(0, 6, 170, 16, 0, 0, 7); g.fill();
  drawCar(0, 0, 0);
  for (const p of S.parts) { g.globalAlpha = 1 - p.age / p.life; drawPart(p, 1 - p.age / p.life); }
  g.globalAlpha = 1;
  g = mainCtx;
}
const priceOf = (cat, it) => cat === 'skill' ? it.prices[skill(it.id)] : it.price;
const isOwned = (cat, it) => cat === 'skill' ? skill(it.id) >= it.prices.length : save.owned[cat].includes(it.id);
const slotOf = (cat, it) => it.slot || SLOT_OF[cat];
const isWorn = (cat, it) => cat !== 'skill' && save.equip[slotOf(cat, it)] === it.id;
function cheapestWant() {
  let min = Infinity;
  for (const cat in CATALOG) for (const it of CATALOG[cat]) if (!isOwned(cat, it)) min = Math.min(min, priceOf(cat, it));
  return min;
}
function picture(c, cat, it) { // each stall item is drawn with the same code the car uses
  const was = g, w = c.width = c.height = 200;
  g = c.getContext('2d'); g.translate(w / 2, w / 2);
  if (cat === 'vehicle') {
    g.translate(0, 74); g.scale(.62, .62); drawCar(0, 0, 0, { vehicle: it.id, paint: save.equip.paint, tyre: save.equip.tyre });
  } else if (cat === 'horn') {
    if (it.pic === 'moose') { g.scale(.4, .4); g.translate(0, 196); drawMoose(376); }
    else if (it.pic === 'horn') { g.translate(-100, -100); g.scale(2, 2); g.fillStyle = NAVY; g.fill(new Path2D('M12 42h20L78 16v68L32 58H12z')); }
    else { g.font = '120px serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(it.pic, 0, 8); }
  } else if (cat === 'paint') {
    g.fillStyle = paintFill(it, -76, 76); g.beginPath(); g.arc(0, 0, 76, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,.4)'; g.beginPath(); g.ellipse(-26, -32, 22, 11, -.7, 0, 7); g.fill();
  } else if (cat === 'tyre') { g.scale(1.9, 1.9); drawWheel(it.id, 42, '#e8483f'); }
  else if (it.slot === 'hat') { g.translate(0, it.id === 'party' || it.id === 'wizard' ? 50 : 24); g.scale(1.45, 1.45); drawHat(it.id); }
  else if (it.slot === 'back') {
    const tall = it.id === 'kite' || it.id === 'balloon' ? .9 : 1;
    g.translate(it.id === 'flag' ? 26 : it.id === 'spoiler' ? -6 : it.id === 'kite' || it.id === 'rod' ? 42 : 16, it.id === 'spoiler' ? 26 : it.id === 'pinwheel' ? 66 : 84); g.scale(it.id === 'spoiler' ? 1.9 : tall, it.id === 'spoiler' ? 1.9 : tall); drawBack(it.id);
  }
  else if (it.slot === 'trail') {
    const C = it.id === 'rainbow' ? ['#f4614d', '#f6e21c', '#3fc36a', '#1d9bf0'] : it.id === 'snow' ? ['#8fd0f0', '#bfe6fb'] : TRAIL[it.id];
    [[-46, 30, 26], [0, -6, 34], [50, -44, 24], [52, 34, 18]].forEach(([x, y, r], i) => drawPart({ x, y, r, shape: ['rainbow', 'snow', 'fire'].includes(it.id) ? 'x' : it.id, c: C[i % C.length] }, 1));
  } else skillIcon(it.id);
  g = was;
}
function skillIcon(id) {
  if (id === 'tank' || id === 'spare') {
    g.save(); g.translate(-82, -84); g.scale(3.4, 3.4);
    g.fillStyle = id === 'tank' ? '#2fb36a' : '#f4614d'; g.fill(canPath); g.fillStyle = '#12306b'; g.fill(canCap); g.restore();
    g.strokeStyle = '#fff'; g.lineWidth = 15; g.lineCap = 'round'; g.beginPath();
    g.moveTo(-34, 22); g.lineTo(30, 22); g.moveTo(-2, -10); g.lineTo(-2, 54); g.stroke();
  } else if (id === 'turbo') {
    g.fillStyle = '#f6c21c'; g.strokeStyle = '#e6a100'; g.lineWidth = 6; g.lineJoin = 'round'; g.beginPath();
    [[18, -86], [-46, 12], [-4, 12], [-20, 86], [50, -18], [8, -18]].forEach(([x, y]) => g.lineTo(x, y)); g.closePath(); g.fill(); g.stroke();
  } else if (id === 'magnet') {
    g.lineCap = 'butt'; g.lineWidth = 42; g.strokeStyle = '#e8483f'; g.beginPath(); g.arc(0, 0, 50, Math.PI, 0, true); g.stroke();
    g.beginPath(); g.moveTo(-50, 0); g.lineTo(-50, -40); g.moveTo(50, 0); g.lineTo(50, -40); g.stroke();
    g.strokeStyle = '#d7dbe4'; g.beginPath(); g.moveTo(-50, -38); g.lineTo(-50, -72); g.moveTo(50, -38); g.lineTo(50, -72); g.stroke();
  } else {
    g.strokeStyle = '#1d9bf0'; g.lineWidth = 14; g.lineCap = 'round'; g.beginPath(); g.moveTo(-40, 62);
    for (let i = 0; i < 5; i++) { g.lineTo(44, 46 - i * 26); g.lineTo(-44, 33 - i * 26); }
    g.stroke();

}
const CAT_ICON = {
  vehicle: '<svg viewBox="0 0 48 48"><path fill="#e8483f" d="M3 31c0-5 3-7 7-7l6-9c.7-1 1.800-1.600 3-1.600h12c1.300 0 2.400.6 3 1.700l4 8.900c4 .4 7 2.500 7 7v3c0 1-1 2-2 2H5c-1 0-2-1-2-2z"/><path fill="#c6ecfb" d="M18 23l4.300-6.500H25V23zM28 16.500h3.300L34.500 23H28z"/><circle cx="14" cy="36" r="6" fill="#2b2d38"/><circle cx="35" cy="36" r="6" fill="#2b2d38"/><circle cx="14" cy="36" r="2.400" fill="#f4f1e8"/><circle cx="35" cy="36" r="2.400" fill="#f4f1e8"/></svg>',
  paint: '<svg viewBox="0 0 48 48"><path fill="#f6c21c" d="M24 5C12 5 4 13 4 24s8 19 19 19c3 0 5-2 5-4.500 0-3-2-4-2-6 0-2 2-3.500 4.500-3.500H36c5 0 8-3 8-8C44 12 35 5 24 5z"/><circle cx="15" cy="21" r="4" fill="#e8483f"/><circle cx="24" cy="13" r="4" fill="#1d9bf0"/><circle cx="34" cy="18" r="4" fill="#22b3a6"/></svg>',
  tyre: '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="#2b2d38"/><circle cx="24" cy="24" r="10" fill="#f4f1e8"/><circle cx="24" cy="24" r="4" fill="#e8483f"/></svg>',
  extra: '<svg viewBox="0 0 48 48"><path fill="#f6c21c" stroke="#e6a100" stroke-width="2" stroke-linejoin="round" d="M6 38 3 14l12 10L24 8l9 16 12-10-3 24z"/></svg>',
  horn: '<svg viewBox="0 0 100 100"><path d="M12 42h20L78 16v68L32 58H12z" fill="#f6c21c"/><path d="M12 40v20" stroke="#f6c21c" stroke-width="12" stroke-linecap="round"/><path d="M86 34q8 16 0 32" stroke="#f6c21c" stroke-width="7" fill="none" stroke-linecap="round"/></svg>',
  skill: '<svg viewBox="0 0 48 48"><path fill="#f4614d" d="M28 3 9 27h12l-3 18 21-26H26z"/></svg>',
};
function renderShop() {
  $('walletN').textContent = save.total;
  $('tabs').innerHTML = Object.keys(CATALOG).map(c => `<button class="tab ${S.tab === c ? 'on' : ''}" data-tab="${c}" aria-label="${{ vehicle: 'Vehicles', paint: 'Colours', tyre: 'Tyres', extra: 'Extras', horn: 'Horns', skill: 'Skills' }[c]}">${CAT_ICON[c]}</button>`).join('');
  const cat = S.tab, box = $('wares'), keep = box.scrollTop;
  box.innerHTML = '';
  CATALOG[cat].forEach((it, i) => {
    const owned = isOwned(cat, it), lvl = cat === 'skill' ? skill(it.id) : 0, b = document.createElement('button');
    const bought = owned || lvl > 0, price = priceOf(cat, it);
    b.className = `ware ${S.pick === it ? 'sel' : ''} ${isWorn(cat, it) ? 'worn' : ''} ${owned ? '' : 'priced'}`;
    b.dataset.i = i; b.setAttribute('aria-label', `${it.id}${owned ? '' : ', ' + price + ' coins'}`);
    const c = document.createElement('canvas'); picture(c, cat, it); b.append(c);
    if (!owned) b.insertAdjacentHTML('beforeend', `<span class="tag"><svg viewBox="0 0 48 48">${COIN_SVG}</svg>${price}</span>`);
    if (cat === 'skill' && it.prices.length > 1) b.insertAdjacentHTML('beforeend', `<span class="pips">${it.prices.map((_, n) => `<i class="${n < lvl ? 'on' : ''}"></i>`).join('')}</span>`);
    if (isWorn(cat, it) || (cat === 'skill' && owned)) b.insertAdjacentHTML('beforeend', '<svg class="tick" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#2fb36a"/><path d="m6.500 12.500 4 4 7-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>');
    box.append(b);
  });
  box.scrollTop = keep;
  const it = S.pick;
  if (it && !isOwned(cat, it)) {
    const price = priceOf(cat, it), poor = price > save.total;
    $('buy').innerHTML = `<button id="buyBtn" class="${poor ? 'poor' : ''}" aria-label="Buy for ${price} coins"><svg viewBox="0 0 48 48">${COIN_SVG}</svg>${price}</button>`;
  } else $('buy').innerHTML = '';
}
function pickWare(it) {
  const cat = S.tab, slot = slotOf(cat, it);
  if (cat === 'skill') {
    S.pick = it; S.trial = null; sfx.tap();
    if (it.id === 'boing') hop(380);
    if (it.id === 'turbo') S.wheel += 3;
  } else if (isOwned(cat, it)) {
    S.pick = null; S.trial = null; sfx.tap();
    const worn = save.equip[slot] === it.id;
    if (!worn) save.equip[slot] = it.id;
    else if (cat === 'extra') save.equip[slot] = null; // tap again to take it off
    persist();
  } else { // not bought yet: try it on the car first
    S.pick = it; S.trial = { slot, id: it.id }; sfx.tap();
  }
  if (cat === 'horn') { S.honkT = .5; sfx.honk(it.id); }
  S.parts = []; renderShop();
}
function buyPick() {
  const cat = S.tab, it = S.pick;
  if (!it || isOwned(cat, it)) return;
  const price = priceOf(cat, it);
  if (price > save.total) {
    const w = $('wallet'); w.classList.remove('broke'); void w.offsetWidth; w.classList.add('broke'); sfx.low();
    return;
  }
  save.total -= price;
  if (cat === 'skill') save.skills[it.id] = skill(it.id) + 1;
  else { save.owned[cat].push(it.id); save.equip[slotOf(cat, it)] = it.id; }
  S.trial = null;
  if (cat !== 'skill' || isOwned(cat, it)) S.pick = null;
  persist(); sfx.win();
  for (let i = 0; i < 28; i++) spark(-110 + Math.random() * 220, -130 + Math.random() * 90, ['#f4614d', '#f6c21c', '#22b3a6', '#f2577d'][i % 4]);
  renderShop();
}
function renderMute() { $('mute').innerHTML = $('mute2').innerHTML = SOUND(!save.muted); }

/* ---------- who is playing. The name stays on this device, and a grown-up types it once ---------- */
const SWEDISH = (navigator.language || '').toLowerCase().startsWith('sv');
function renderHello() {
  const b = $('hello');
  b.hidden = !save.name; b.textContent = save.name ? `${SWEDISH ? 'Hej' : 'Hi'} ${save.name}!` : '';
  $('whoBtn').hidden = !!save.name;
}
function sayHi() {
  if (S.greeted || !save.name || save.muted || !window.speechSynthesis) return;
  S.greeted = true;
  const u = new SpeechSynthesisUtterance(`${SWEDISH ? 'Hej' : 'Hi'} ${save.name}!`);
  u.lang = SWEDISH ? 'sv-SE' : 'en-GB'; u.rate = .9; u.pitch = 1.3;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function askName(next) {
  S.whoNext = next; save.askedName = true; persist();
  $('whoName').value = save.name; $('whoLabel').textContent = SWEDISH ? 'Vad heter du?' : "What's your name?";
  show('who'); $('whoName').focus();
}
function setName(name) {
  save.name = String(name).trim().slice(0, 20); S.greeted = false; persist(); renderHello();
  show(S.whoNext); if (S.whoNext === 'map') sayHi();
}

/* ---------- full screen: iPhones have no such thing, so the button only shows where it can work ---------- */
const root = document.documentElement, fsAsk = root.requestFullscreen || root.webkitRequestFullscreen;
const installed = navigator.standalone || matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;
const fsNow = () => document.fullscreenElement || document.webkitFullscreenElement;
const FULL_ICON = on => `<svg viewBox="0 0 24 24"><path fill="none" stroke="#12306b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="${on ? 'M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6' : 'M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6'}"/></svg>`;
function renderFull() {
  document.querySelectorAll('.full').forEach(b => {
    b.hidden = !fsAsk || installed; b.innerHTML = FULL_ICON(!!fsNow());
    b.setAttribute('aria-label', fsNow() ? 'Leave full screen' : 'Full screen');
  });
}
function toggleFull() {
  if (fsNow()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else { const p = fsAsk.call(root); if (p && p.catch) p.catch(() => {}); }
}
['fullscreenchange', 'webkitfullscreenchange'].forEach(n => document.addEventListener(n, () => { renderFull(); resize(); }));

/* ---------- input ---------- */
const tap = (id, fn) => $(id).addEventListener('click', () => { wakeAudio(); sfx.tap(); fn(); });
tap('titlePlay', () => { if (!save.askedName) return askName('map'); sayHi(); show('map'); });
tap('hello', () => askName('title')); tap('whoBtn', () => askName('title'));
tap('whoSkip', () => show(S.whoNext));
$('whoForm').addEventListener('submit', e => { e.preventDefault(); wakeAudio(); sfx.tap(); setName($('whoName').value); });
['fullT', 'fullM', 'fullH'].forEach(id => tap(id, toggleFull));
tap('home', () => { persist(); resetRun(0); S.x = 300; show('map'); });
const toggleMute = () => { save.muted = !save.muted; persist(); renderMute(); };
tap('mute', toggleMute); tap('mute2', toggleMute);
tap('winMap', () => show('map')); tap('lostMap', () => show('map'));
tap('winAgain', () => startLevel(S.L.n)); tap('lostAgain', () => startLevel(S.L.n));
tap('winNext', () => startLevel(S.L.n + 1));
$('stops').addEventListener('click', e => { const b = e.target.closest('.stop'); if (b && !b.disabled) { wakeAudio(); sfx.tap(); startLevel(+b.dataset.n); } });
tap('shopBtn', () => show('shop'));
tap('shopBack', () => show('map'));
$('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) { S.tab = b.dataset.tab; S.trial = S.pick = null; sfx.tap(); renderShop(); } });
$('wares').addEventListener('click', e => { const b = e.target.closest('.ware'); if (b) { wakeAudio(); pickWare(CATALOG[S.tab][+b.dataset.i]); } });
$('buy').addEventListener('click', e => { if (e.target.closest('#buyBtn')) { wakeAudio(); buyPick(); } });

$('act').addEventListener('pointerdown', e => { e.preventDefault(); act(); });
const gasBtn = $('gas');
const gasOn = () => { wakeAudio(); S.gas = true; gasBtn.classList.add('down'); };
const gasOff = () => { S.gas = false; gasBtn.classList.remove('down'); };
gasBtn.addEventListener('pointerdown', e => { e.preventDefault(); gasBtn.setPointerCapture(e.pointerId); gasOn(); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => gasBtn.addEventListener(n, gasOff));
$('up').addEventListener('pointerdown', e => { e.preventDefault(); chooseLane(-1); });
$('down').addEventListener('pointerdown', e => { e.preventDefault(); chooseLane(1); });
$('c').addEventListener('pointerdown', e => { // tap the car to honk, or tap a road to choose it
  wakeAudio();
  if (S.screen !== 'play') return;
  const carScreenX = clamp(vw * .32, 230, 460) * sc;
  if (Math.abs(e.clientX - carScreenX) < 130 * sc) { S.honkT = .5; if (blockingCritter()) act(); else sfx.honk(); }
  else if (S.activeFork && !S.lane) chooseLane(e.clientY < innerHeight / 2 ? -1 : 1);
});
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (S.screen === 'play') {
    if (e.code === 'Space' || e.code === 'ArrowRight') { e.preventDefault(); gasOn(); }
    if (e.code === 'ArrowUp') { e.preventDefault(); if (S.activeFork && !S.lane) chooseLane(-1); else if (S.L.obs.length) act(); }
    if (e.code === 'ArrowDown') { e.preventDefault(); chooseLane(1); }
    if (e.code === 'KeyH') { S.honkT = .5; sfx.honk(); }
  }
});

if (location.hostname === 'localhost') window.lillaBil = { act, CATALOG, buyPick, pickWare, S, buildLevel, SPECS, TANK, startLevel, chooseLane, show, setName, renderMap, draw, THEMES, get save() { return save; }, tick: update };
